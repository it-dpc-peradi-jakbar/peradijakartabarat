services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      APP_TIMEZONE: Asia/Jakarta
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: peradi_jakbar
      DB_USERNAME: peradi
      DB_PASSWORD: peradi
      PHP_CLI_SERVER_WORKERS: "2"
      FEATURE_LOGBOOK: "false"
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: peradi_jakbar
      MYSQL_USER: peradi
      MYSQL_PASSWORD: peradi
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uperadi", "-pperadi"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
